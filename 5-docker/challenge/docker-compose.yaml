version: "3.8" # Docker compose file format version

services:
  nginx:
    image: nginx:latest
    ports:
      - "5001:80" # Map port 5001 on the host to port 80 in the container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount the nginx.conf file from the host to the container as read-only (:ro)
      # Replaces the default nginx.conf file in the container with this custom configuration
    depends_on:
      - web
    environment:
      - REDIS_HOST=redis_host
      - REDIS_PORT=6379

  web:
    build: .
    expose:
      - "5001" # Informs docker that port 5001 to other services in the private Docker network (not to the host)
    depends_on:
      - mydb_redis

  mydb_redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
